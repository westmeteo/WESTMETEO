<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Previsión (prototipo meteograma) · @westmeteo</title>
<style>
  :root{ --bg:#263d52; --panel:#16293d; --line:#33506b; --ink:#eaf2f8; --ink2:#cfe0ee; --mut:#7f9bb3;
         --azul:#8fd0ff; --temp:#ff9d5c; --sens:#ffe14d; --viento:#a8d96a; --racha:#4e9a52; --lluvia:#4aa3ff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;-webkit-text-size-adjust:100%}
  header{padding:7px 14px 2px}
  h1{font-size:15px;margin:0} .sub{color:var(--azul);font-size:11.5px;font-weight:600}
  .wm{height:24px;width:auto;border-radius:4px;display:block}
  .beta{background:#b4532a;color:#fff;font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:6px}
  .fuente{color:var(--mut);font-size:11px;margin:1px 0 0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 14px 8px}
  .loctipo{display:inline-flex;border:1px solid #3a80c4;border-radius:8px;overflow:hidden}
  .loctipo .lt{font:700 .78rem/1 system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;background:#22384c;color:#7fa7c6;border:none;padding:7px 14px;cursor:pointer}
  .loctipo .lt.activa{background:#3a80c4;color:#fff}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
  .leg{display:grid;grid-template-columns:repeat(3,max-content);gap:8px 14px;justify-content:center;font-size:11px;color:var(--ink2);padding:2px 14px 4px}
  .leg b{display:inline-flex;align-items:center;gap:6px;font-weight:600;cursor:pointer;user-select:none;transition:.15s;
         border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:4px 10px}
  .leg b.off{opacity:.45;background:none;border-color:#2a3f54}
  #topbar{position:sticky;top:0;z-index:30;background:var(--bg);box-shadow:0 3px 8px rgba(0,0,0,.4)}
  .modes{display:flex;gap:10px;justify-content:center;align-items:center;padding:4px 14px 8px}
  .mode{font:700 13px system-ui,sans-serif;color:var(--ink2);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
  .mode.on{background:#2980b9;color:#fff;border-color:#2980b9}
  .sw{width:16px;height:4px;border-radius:2px;display:inline-block}
  .sw.sq{height:11px;width:11px;border-radius:2px}
  #charts .mg-box{margin-top:14px}
  #charts .mg-box:first-child{margin-top:0}
  .cap{color:#9fb6c8;font-size:12px;font-weight:800;padding:2px 14px 4px}
  .mg-posic{position:relative}
  .mg-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
           border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(#0c1a28,#0f1f30)}
  .mg-wrap svg{display:block}
  .mg-content{position:relative}
  .axis{position:absolute;left:0;top:1px;pointer-events:none;background:linear-gradient(#0c1a28,#0f1f30);border-right:1px solid rgba(58,86,112,.35)}
  .kmaxis{position:absolute;left:50%;top:1px;transform:translateX(-50%);pointer-events:none}
  .dayrow{position:absolute;top:7px;left:0;height:26px;display:flex;pointer-events:none}
  .daysec{position:relative;height:24px;flex:0 0 auto}
  .daylbl{position:sticky;left:56px;width:max-content;white-space:nowrap;font:800 17px system-ui,sans-serif;color:#eaf2f8;text-shadow:0 1px 2px #0c1a28}
  .hint{color:var(--mut);font-size:11px;padding:8px 14px;text-align:center}
  #tip{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,20,32,.97);
       border:1px solid var(--azul);border-radius:12px;padding:14px 16px 12px;font-size:13px;color:var(--ink);
       pointer-events:auto;display:none;min-width:210px;box-shadow:0 12px 34px rgba(0,0,0,.6)}
  #tip h4{margin:0 10px 7px 0;font-size:12px;color:var(--azul)}
  #tip .tipx{position:absolute;top:5px;right:9px;color:#9fb6c8;font-size:16px;font-weight:800;cursor:pointer;line-height:1}
  #tip .tipx:hover{color:#fff}
  #tip .r{display:flex;justify-content:space-between;gap:12px}
  #tip .k{color:var(--mut)}
  footer{color:var(--mut);font-size:11px;padding:10px 14px 24px}
  .warn{color:#e0994a}
</style>
</head>
<body data-palette="#ff9d5c,#5fe0c0,#4aa3ff,#8fd0ff">
<div id="topbar">
<header>
  <h1>Previsión 7 días WestMeteo <span class="sub">(AROME/ECMWF × WM1.0)</span></h1>

</header>
<div class="row">
  <div class="loctipo"><button type="button" class="lt activa" data-tipo="loc">Localidades</button><button type="button" class="lt" data-tipo="montana">Montaña</button></div>
  <select id="sel"></select>
</div>
<div class="modes"><img class="wm" src="banner.jpg" alt="WestMeteo"><button id="mGen" class="mode on">Previsión general</button><button id="mDet" class="mode">Previsión detallada</button></div>
<div class="leg">
  <b data-k="temp"><span class="sw" style="background:var(--temp)"></span>Temperatura</b>
  <b data-k="sens"><span class="sw" style="background:var(--sens)"></span>Sensación</b>
  <b data-k="lluvia"><span class="sw sq" style="background:var(--lluvia);opacity:.6"></span>Lluvia</b>
  <b data-k="viento"><span class="sw" style="background:var(--viento)"></span>Viento</b>
  <b data-k="racha"><span class="sw" style="background:repeating-linear-gradient(90deg,var(--racha) 0 3px,transparent 3px 6px)"></span>Racha</b>
  <b data-k="nubes"><span class="sw sq" style="background:linear-gradient(90deg,#d8dee4,#4a535c)"></span>Nubes</b>
</div>
</div>
<div id="charts"></div>
<div class="hint">Cada bloque = 7 días; el siguiente empieza un día después · desliza con el dedo ← → · toca una hora</div>
<div id="tip"></div>
<footer id="foot"></footer>

<script>
/* ===== config ===== */
const LOCS = [{"n": "Abadía", "lat": 40.2594, "lon": -5.9781, "z": "Sierra de Béjar"}, {"n": "Aldeacipreste", "lat": 40.3811, "lon": -5.8979, "z": "Sierra de Béjar"}, {"n": "Aldeanueva del Camino", "lat": 40.259, "lon": -5.9297, "z": "Sierra de Béjar"}, {"n": "Baños de Montemayor", "lat": 40.3178, "lon": -5.8573, "z": "Sierra de Béjar"}, {"n": "Becedas", "lat": 40.405, "lon": -5.6343, "z": "Sierra de Béjar"}, {"n": "Béjar", "lat": 40.3866, "lon": -5.765, "z": "Sierra de Béjar"}, {"n": "Cabezuela del Valle", "lat": 40.1927, "lon": -5.8056, "z": "Sierra de Béjar"}, {"n": "Canchal de la Ceja (2425 m)", "lat": 40.3097, "lon": -5.7017, "z": "Sierra de Béjar", "alt": 2425, "m": 1}, {"n": "Candelario", "lat": 40.3684, "lon": -5.7448, "z": "Sierra de Béjar"}, {"n": "Cantagallo", "lat": 40.3731, "lon": -5.8178, "z": "Sierra de Béjar"}, {"n": "Casas del Monte", "lat": 40.2024, "lon": -5.9604, "z": "Sierra de Béjar"}, {"n": "Colmenar de Montemayor", "lat": 40.3992, "lon": -5.9563, "z": "Sierra de Béjar"}, {"n": "Cristóbal", "lat": 40.4693, "lon": -5.8899, "z": "Sierra de Béjar"}, {"n": "El Barco de Ávila", "lat": 40.3577, "lon": -5.5231, "z": "Sierra de Béjar"}, {"n": "El Cerro", "lat": 40.327, "lon": -5.916, "z": "Sierra de Béjar"}, {"n": "El Losar del Barco", "lat": 40.3932, "lon": -5.5393, "z": "Sierra de Béjar"}, {"n": "El Tejado", "lat": 40.4427, "lon": -5.5388, "z": "Sierra de Béjar"}, {"n": "El Travieso (1850 m)", "lat": 40.315, "lon": -5.695, "z": "Sierra de Béjar", "alt": 1850, "m": 1}, {"n": "Fresnedoso", "lat": 40.4363, "lon": -5.7096, "z": "Sierra de Béjar"}, {"n": "Gargantilla", "lat": 40.2483, "lon": -5.9202, "z": "Sierra de Béjar"}, {"n": "Gil García", "lat": 40.2978, "lon": -5.5942, "z": "Sierra de Béjar"}, {"n": "Gilbuena", "lat": 40.415, "lon": -5.6063, "z": "Sierra de Béjar"}, {"n": "Hervás", "lat": 40.2739, "lon": -5.8587, "z": "Sierra de Béjar"}, {"n": "Horcajo de Montemayor", "lat": 40.4215, "lon": -5.8945, "z": "Sierra de Béjar"}, {"n": "Hoya Moros (2000 m)", "lat": 40.303, "lon": -5.706, "z": "Sierra de Béjar", "alt": 2000, "m": 1}, {"n": "Jerte", "lat": 40.2226, "lon": -5.751, "z": "Sierra de Béjar"}, {"n": "Junciana", "lat": 40.4113, "lon": -5.5568, "z": "Sierra de Béjar"}, {"n": "La Calzada de Béjar", "lat": 40.4116, "lon": -5.8183, "z": "Sierra de Béjar"}, {"n": "La Carrera", "lat": 40.3478, "lon": -5.555, "z": "Sierra de Béjar"}, {"n": "La Garganta", "lat": 40.3284, "lon": -5.8229, "z": "Sierra de Béjar"}, {"n": "La Granja", "lat": 40.2393, "lon": -5.9946, "z": "Sierra de Béjar"}, {"n": "La Hoya", "lat": 40.4066, "lon": -5.6989, "z": "Sierra de Béjar"}, {"n": "Lagunilla", "lat": 40.3247, "lon": -5.9718, "z": "Sierra de Béjar"}, {"n": "Ledrada", "lat": 40.4689, "lon": -5.7201, "z": "Sierra de Béjar"}, {"n": "Los Llanos de Tormes", "lat": 40.3283, "lon": -5.5002, "z": "Sierra de Béjar"}, {"n": "Medinilla", "lat": 40.44, "lon": -5.6182, "z": "Sierra de Béjar"}, {"n": "Molinillo", "lat": 40.469, "lon": -5.9452, "z": "Sierra de Béjar"}, {"n": "Montemayor del Río", "lat": 40.3478, "lon": -5.8949, "z": "Sierra de Béjar"}, {"n": "Nava de Béjar", "lat": 40.4754, "lon": -5.6787, "z": "Sierra de Béjar"}, {"n": "Nava del Barco", "lat": 40.2947, "lon": -5.5408, "z": "Sierra de Béjar"}, {"n": "Navacarros", "lat": 40.398, "lon": -5.7143, "z": "Sierra de Béjar"}, {"n": "Navaconcejo", "lat": 40.1768, "lon": -5.8296, "z": "Sierra de Béjar"}, {"n": "Navalmoral de Béjar", "lat": 40.4231, "lon": -5.7828, "z": "Sierra de Béjar"}, {"n": "Navalonguilla", "lat": 40.2786, "lon": -5.5007, "z": "Sierra de Béjar"}, {"n": "Navatejares", "lat": 40.3355, "lon": -5.5321, "z": "Sierra de Béjar"}, {"n": "Neila de San Miguel", "lat": 40.4235, "lon": -5.6508, "z": "Sierra de Béjar"}, {"n": "Peromingo", "lat": 40.4636, "lon": -5.7722, "z": "Sierra de Béjar"}, {"n": "Peñacaballera", "lat": 40.3443, "lon": -5.8607, "z": "Sierra de Béjar"}, {"n": "Pinedas", "lat": 40.445, "lon": -5.9609, "z": "Sierra de Béjar"}, {"n": "Puerto Castilla", "lat": 40.2896, "lon": -5.6297, "z": "Sierra de Béjar"}, {"n": "Puerto de Béjar", "lat": 40.35, "lon": -5.8389, "z": "Sierra de Béjar"}, {"n": "San Bartolomé de Béjar", "lat": 40.408, "lon": -5.6627, "z": "Sierra de Béjar"}, {"n": "Sanchotello", "lat": 40.4383, "lon": -5.7532, "z": "Sierra de Béjar"}, {"n": "Segura de Toro", "lat": 40.2234, "lon": -5.9478, "z": "Sierra de Béjar"}, {"n": "Solana de Ávila", "lat": 40.3154, "lon": -5.6122, "z": "Sierra de Béjar"}, {"n": "Sorihuela", "lat": 40.444, "lon": -5.6778, "z": "Sierra de Béjar"}, {"n": "Tormellas", "lat": 40.3042, "lon": -5.5117, "z": "Sierra de Béjar"}, {"n": "Tornavacas", "lat": 40.2557, "lon": -5.6885, "z": "Sierra de Béjar"}, {"n": "Umbrías", "lat": 40.3131, "lon": -5.5785, "z": "Sierra de Béjar"}, {"n": "Valdefuentes de Sangusín", "lat": 40.4664, "lon": -5.8326, "z": "Sierra de Béjar"}, {"n": "Valdehijaderos", "lat": 40.4193, "lon": -5.8489, "z": "Sierra de Béjar"}, {"n": "Valdelageve", "lat": 40.3691, "lon": -5.991, "z": "Sierra de Béjar"}, {"n": "Vallejera de Riofrío", "lat": 40.4091, "lon": -5.7196, "z": "Sierra de Béjar"}, {"n": "Guijuelo", "lat": 40.556, "lon": -5.669, "z": "Ciudades"}, {"n": "Plasencia", "lat": 40.031, "lon": -6.089, "z": "Ciudades"}, {"n": "Salamanca", "lat": 40.965, "lon": -5.664, "z": "Ciudades"}, {"n": "Ávila", "lat": 40.656, "lon": -4.7, "z": "Ciudades"}, {"n": "Ameal de Pablo (2509 m)", "lat": 40.247, "lon": -5.268, "z": "Sierra de Gredos", "alt": 2509, "m": 1}, {"n": "Cerro del Morezón (2401 m)", "lat": 40.265, "lon": -5.247, "z": "Sierra de Gredos", "alt": 2401, "m": 1}, {"n": "Hoyos del Espino", "lat": 40.348, "lon": -5.171, "z": "Sierra de Gredos"}, {"n": "Laguna Grande (2000 m)", "lat": 40.2513, "lon": -5.279, "z": "Sierra de Gredos", "alt": 2000, "m": 1}, {"n": "Navarredonda de Gredos", "lat": 40.3455, "lon": -5.135, "z": "Sierra de Gredos"}, {"n": "Pico Almanzor (2592 m)", "lat": 40.2397, "lon": -5.2807, "z": "Sierra de Gredos", "alt": 2592, "m": 1}, {"n": "Plataforma de Gredos (1750 m)", "lat": 40.283, "lon": -5.219, "z": "Sierra de Gredos", "alt": 1750, "m": 1}, {"n": "Refugio Victory (1975 m)", "lat": 40.253, "lon": -5.281, "z": "Sierra de Gredos", "alt": 1975, "m": 1}];
// WM1.0: la lluvia SOLO se realza con flujo del S/SO/O (upslope en la sierra). PROVISIONAL.
const WM02 = { precipArome: 3.0, precipEcmwf: 3.8, tempOffset: 0.0, windFactor: 1.0 };
const   WM02_ON=true;   // sesgo WM1.0 SIEMPRE activo (realce de lluvia solo con flujo S/SO/O)
const PLEV=[[1000,110],[925,760],[850,1460],[700,3010],[500,5570],[400,7180],[300,9160],[250,10360],[200,11780]]; // hPa -> altitud m
const enSO = dir => dir!=null && dir>=175 && dir<=280;
function precipCorr(raw, dir, src){ if(!raw) return 0; return (WM02_ON && enSO(dir)) ? raw*(src==='A'?WM02.precipArome:WM02.precipEcmwf) : raw; }

const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const capMes=m=>{const s=MES[m];return s.charAt(0).toUpperCase()+s.slice(1);};
const RUMBOS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
const MAX_CHARTS=6;

/* ===== geometría ===== */
const HOURW=46, PADL=56, PADR=20, TOP=64, BOT=52, Hsvg=372;
const plotT=TOP, plotB=Hsvg-BOT, plotH=plotB-plotT;

const sel=document.getElementById('sel'), tip=document.getElementById('tip');
function poblarSelector(tipo){
  sel.innerHTML=''; let lista=LOCS.filter(l=> tipo==='montana'?l.m:!l.m);
  if(tipo!=='montana'){ // localidades: todas juntas, orden alfabético, sin agrupar por zona
    lista=[...lista].sort((a,b)=>a.n.localeCompare(b.n,'es'));
    for(const l of lista){ const o=document.createElement('option'); o.textContent=l.n; sel.appendChild(o); }
  } else { let zona='';
    for(const l of lista){ if(l.z!==zona){zona=l.z; const og=document.createElement('optgroup'); og.label=l.z; sel.appendChild(og);} const o=document.createElement('option'); o.textContent=l.n; sel.lastChild.appendChild(o); }
  }
  const def=tipo==='montana'?'Pico Almanzor (2592 m)':'Béjar'; let idx=0; [...sel.options].forEach((o,i)=>{ if(o.textContent===def) idx=i; }); sel.selectedIndex=idx;
}
function locSeleccionada(){ if(!sel.options.length) return null; return LOCS.find(l=>l.n===sel.options[sel.selectedIndex].textContent); }
poblarSelector('loc');
let DATA=null;
const VIS_DET={nubes:true,temp:true,sens:false,lluvia:true,viento:true,racha:false};   // detallada: todo menos sensación y racha
const VIS_GEN={nubes:true,temp:true,sens:false,lluvia:true,viento:false,racha:false};  // general: temperatura, lluvia y nubes
let MODE='gen', VISI=VIS_GEN, DATAGEN=null;
function DS(){ return (MODE==='gen'&&DATAGEN)?DATAGEN:DATA; }
function buildGen(){   // agrega cada 6 h (4 bloques/día): medias (y suma de lluvia)
  const n=DATA.time.length, B=6, m=Math.ceil(n/B);
  const avg=(arr,i)=>{let s=0,c=0;for(let k=i*B;k<i*B+B&&k<n;k++){const v=arr[k];if(v!=null){s+=v;c++;}}return c?s/c:null;};
  const sum=(arr,i)=>{let s=0;for(let k=i*B;k<i*B+B&&k<n;k++)s+=arr[k]||0;return s;};
  const dirA=(i)=>{let x=0,y=0,c=0;for(let k=i*B;k<i*B+B&&k<n;k++){const d=DATA.dir[k];if(d!=null){x+=Math.cos(d*Math.PI/180);y+=Math.sin(d*Math.PI/180);c++;}}if(!c)return null;return (Math.atan2(y,x)*180/Math.PI+360)%360;};
  const mn=(arr,i)=>{let v=Infinity;for(let k=i*B;k<i*B+B&&k<n;k++){const x=arr[k];if(x!=null&&x<v)v=x;}return isFinite(v)?v:null;};
  const mx=(arr,i)=>{let v=-Infinity;for(let k=i*B;k<i*B+B&&k<n;k++){const x=arr[k];if(x!=null&&x>v)v=x;}return isFinite(v)?v:null;};
  const col=(f)=>Array.from({length:m},(_,i)=>f(i));
  const g={ time:col(i=>DATA.time[i*B]), src:col(i=>DATA.src[i*B]),
    temp:col(i=>avg(DATA.temp,i)), sens:col(i=>avg(DATA.sens,i)), praw:col(i=>sum(DATA.praw,i)),
    tmin:col(i=>mn(DATA.temp,i)), tmax:col(i=>mx(DATA.temp,i)),
    smin:col(i=>mn(DATA.sens,i)), smax:col(i=>mx(DATA.sens,i)),
    cl:col(i=>avg(DATA.cl,i)), cm:col(i=>avg(DATA.cm,i)), ch:col(i=>avg(DATA.ch,i)), ctot:col(i=>avg(DATA.ctot,i)),
    wind:col(i=>avg(DATA.wind,i)), gust:col(i=>avg(DATA.gust,i)), dir:col(i=>dirA(i)),
    l:DATA.l, nA:Math.ceil(DATA.nA/B) };
  g.clev=(DATA.clev||[]).map(L=>({z:L.z, arr:col(i=>avg(L.arr,i))}));
  return g;
}

function ns(t){return document.createElementNS('http://www.w3.org/2000/svg',t);}
function el(t,a,txt){const e=ns(t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}
function tks(min,max,n){ const span=(max-min)||1; let step=Math.pow(10,Math.floor(Math.log10(span/n))); const e=(span/n)/step; step*= e>=5?5:e>=2?2:1; const out=[]; for(let v=Math.ceil(min/step)*step; v<=max+1e-6; v+=step) out.push(v); return out; }

/* ===== datos ===== */
async function cargar(){
  const l=locSeleccionada()||LOCS[0];
  document.getElementById('fuente').textContent='Cargando AROME + ECMWF…';
  const vars='temperature_2m,apparent_temperature,precipitation,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,'+
             'wind_speed_10m,wind_gusts_10m,wind_direction_10m';
  const extraCloud=PLEV.map(([p])=>`cloud_cover_${p}hPa`).join(',');
  const u=(m,days,extra)=>`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}`+
    (l.alt?`&elevation=${l.alt}`:'')+
    `&hourly=${vars}${extra?','+extra:''}&models=${m}&timezone=Europe%2FMadrid&windspeed_unit=kmh&forecast_days=${days}`;
  let A,E;
  try{
    [A,E]=await Promise.all([
      fetch(u('meteofrance_arome_france_hd',3)).then(r=>r.json()).catch(()=>null),   // AROME: mientras cubra
      fetch(u('ecmwf_ifs025',15,extraCloud)).then(r=>r.json()),                      // ECMWF: 15 días (temporal) + perfil de nubes
    ]);
  }catch(e){ document.getElementById('fuente').innerHTML='<span class="warn">No se pudo cargar la previsión.</span>'; return; }
  const EH=E.hourly, AH=(A&&A.hourly)||{time:[]};
  const aIdx={}; (AH.time||[]).forEach((t,k)=>aIdx[t]=k);
  const N=EH.time.length, src=new Array(N);
  for(let i=0;i<N;i++){ const ak=aIdx[EH.time[i]]; const aT=(ak!=null&&AH.temperature_2m)?AH.temperature_2m[ak]:null; src[i]=(aT!=null)?'A':'E'; }
  const mix=f=> EH.time.map((t,i)=>{ const ak=aIdx[t]; return (src[i]==='A'&&AH[f])?AH[f][ak]:EH[f][i]; });
  const prRaw=mix('precipitation');
  DATA={
    time:EH.time.map(t=>new Date(t)),
    temp:mix('temperature_2m').map(v=> v==null?null:v+WM02.tempOffset),
    sens:mix('apparent_temperature'),
    praw:prRaw.map(v=> v==null?0:v),
    cl:mix('cloud_cover_low'), cm:mix('cloud_cover_mid'), ch:mix('cloud_cover_high'), ctot:mix('cloud_cover'),
    wind:mix('wind_speed_10m').map(v=> v==null?null:v*WM02.windFactor),
    gust:mix('wind_gusts_10m').map(v=> v==null?null:v*WM02.windFactor),
    dir:mix('wind_direction_10m'), src,
  };
  DATA.l=l; DATA.nA=src.filter(s=>s==='A').length;
  DATA.clev=PLEV.map(([p,z])=>({z,arr:EH['cloud_cover_'+p+'hPa']})).filter(o=>o.arr&&o.arr.some(v=>v!=null&&v>3));
  DATAGEN=buildGen();
  pintarTodo();
}

function setFuente(){ const f=document.getElementById('fuente'); if(f) f.textContent=''; }

function pintarTodo(){
  const host=document.getElementById('charts'); host.innerHTML='';
  if(!DATA){ return; }
  const D=DS();
  if(MODE==='gen'){            // general: una gráfica por día (4 bloques de 6 h que llenan el ancho)
    const perDay=4, days=Math.min(7, Math.ceil(D.time.length/perDay));
    for(let k=0;k<days && k*perDay<D.time.length;k++) drawChart(k, k*perDay, Math.min(D.time.length, k*perDay+perDay), true);
  } else {                     // detallada: horaria, con scroll
    const now=new Date(); let nowIdx=0;
    for(let i=0;i<D.time.length-1;i++){ if(D.time[i]<=now && now<D.time[i+1]){ nowIdx=i; break; } }
    const end7=Math.min(D.time.length, 7*24), end15=Math.min(D.time.length, 15*24);
    drawChart(0, nowIdx, end15, true);
    for(let k=1; k*24 < end7; k++) drawChart(k, k*24, end7, false);
  }
  setFuente();
}

/* ===== una gráfica (ventana de 7 días desde el índice s) ===== */
function drawChart(cid, s, endIdx, fromStart){
  const D=DS(), N=D.time.length, nH=endIdx - s;
  if(nH<1) return;
  const GEN=(MODE==='gen');
  const SW = GEN ? Math.max(48, ((document.getElementById('charts').clientWidth||innerWidth)-PADL-PADR)/4) : HOURW;
  const stepMs = GEN ? 6*3600000 : 3600000;
  const box=document.createElement('div'); box.className='mg-box';
  const posic=document.createElement('div'); posic.className='mg-posic';
  const wrap=document.createElement('div'); wrap.className='mg-wrap';
  const content=document.createElement('div'); content.className='mg-content';
  const svg=ns('svg'); content.appendChild(svg);
  const axis=ns('svg'); axis.setAttribute('class','axis');
  const kmov=ns('svg'); kmov.setAttribute('class','kmaxis'); kmov.setAttribute('width',40); kmov.setAttribute('height',Hsvg); kmov.setAttribute('viewBox',`0 0 40 ${Hsvg}`);
  const dayrow=document.createElement('div'); dayrow.className='dayrow'; content.appendChild(dayrow);
  wrap.appendChild(content);
  posic.appendChild(wrap); posic.appendChild(axis); posic.appendChild(kmov);
  box.appendChild(posic);
  document.getElementById('charts').appendChild(box);

  const W=PADL+PADR+nH*SW, gw0=PADL, gw1=W-PADR;
  svg.setAttribute('width',W); svg.setAttribute('height',Hsvg); svg.setAttribute('viewBox',`0 0 ${W} ${Hsvg}`);
  const X=j=>PADL+j*SW, XC=j=>X(j)+SW/2, G=j=>s+j;

  const defs=ns('defs'); svg.appendChild(defs);
  const fid='f'+cid;
  defs.insertAdjacentHTML('beforeend',
    `<filter id="${fid}" x="-8%" y="-45%" width="116%" height="190%">`+
    '<feTurbulence type="fractalNoise" baseFrequency="0.011 0.045" numOctaves="4" seed="11" result="n"/>'+
    `<feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" result="d"/>`+
    '<feGaussianBlur in="d" stdDeviation="2.4"/></filter>');

  // escalas sobre la ventana
  const T=[]; for(let j=0;j<nH;j++){const a=D.temp[G(j)],b=D.sens[G(j)]; if(a!=null)T.push(a); if(VISI.sens&&b!=null)T.push(b);
    if(D.tmax&&D.tmax[G(j)]!=null)T.push(D.tmax[G(j)]); if(D.tmin&&D.tmin[G(j)]!=null)T.push(D.tmin[G(j)]);
    if(VISI.sens&&D.smax&&D.smax[G(j)]!=null)T.push(D.smax[G(j)]); if(VISI.sens&&D.smin&&D.smin[G(j)]!=null)T.push(D.smin[G(j)]); }
  let tmin=0,tmax=10; if(T.length){ tmin=Math.floor(Math.min(...T)-1); tmax=Math.ceil(Math.max(...T)+1); }
  const tY=t=>plotB-(t-tmin)/((tmax-tmin)||1)*(plotH-16)-8;
  let wmax=25; for(let j=0;j<nH;j++) wmax=Math.max(wmax, D.wind[G(j)]||0, D.gust[G(j)]||0);
  const wY=w=>plotB-(w/wmax)*(plotH*0.55)-6;
  const PC=[]; for(let j=0;j<nH;j++){ const g=G(j); PC[j]=precipCorr(D.praw[g]||0, D.dir[g], D.src[g]); }
  let rmax=3; for(let j=0;j<nH;j++) rmax=Math.max(rmax,PC[j]); const rPx=plotH*0.42;

  const grisCover=c=>{const f=Math.max(0,Math.min(1,c/100));const L=Math.round(216-f*154);return `rgb(${L},${L+5},${L+11})`;};
  const alphaCover=c=>{const f=Math.max(0,Math.min(1,c/100));return (Math.pow(f,0.8)*0.92).toFixed(3);};
  const gradF=(id,valAt)=>{let st='',has=false;
    for(let j=0;j<nH;j++){ let c=valAt(j); if(c==null||c<0)c=0; if(c>0)has=true;   // stop en TODAS las horas (0% = transparente) para que no se rellene donde no hay nube
      st+=`<stop offset="${((j+0.5)/nH).toFixed(4)}" stop-color="${grisCover(c)}" stop-opacity="${alphaCover(c)}"/>`;}
    if(!has)return null;
    defs.insertAdjacentHTML('beforeend',`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${gw0}" y1="0" x2="${gw1}" y2="0">${st}</linearGradient>`);
    return id;};

  // NUBES por altitud (perfil de presión ECMWF)
  if(VISI.nubes && D.clev&&D.clev.length){
    const lev=D.clev.slice().sort((a,b)=>a.z-b.z);
    const zBase=0, zTop=Math.max(2600, lev[lev.length-1].z+800);
    const zY=z=>plotB-(z-zBase)/(zTop-zBase)*plotH;
    const thick=z=>Math.max(9, 26-(z/12000)*17);   // decks bajos gruesos, nubes medias algo más finas
    const low=lev.filter(l=>l.z<6000), high=lev.filter(l=>l.z>=6000);
    // bajo/medio (<6000 m): puentes entre niveles contiguos con nube (masa continua) + lámina por nivel
    for(let k=0;k<low.length-1;k++){ const lo=low[k], hi=low[k+1];
      const id=gradF(`br${cid}_${k}`, j=>{ const a=lo.arr[G(j)], b=hi.arr[G(j)]; return (a!=null&&b!=null&&a>0&&b>0)?Math.min(a,b):null; });
      if(id){ const y1=zY(hi.z), y2=zY(lo.z); svg.appendChild(el('rect',{x:gw0,y:y1.toFixed(1),width:(gw1-gw0),height:(y2-y1).toFixed(1),fill:`url(#${id})`,filter:`url(#${fid})`})); } }
    low.forEach((l,k)=>{ const id=gradF(`cl${cid}_${k}`, j=>l.arr[G(j)]); if(!id)return; const y=zY(l.z), h=thick(l.z);
      svg.appendChild(el('rect',{x:gw0,y:(y-h/2).toFixed(1),width:(gw1-gw0),height:h.toFixed(1),fill:`url(#${id})`,filter:`url(#${fid})`})); });
    // alto (>=6000 m): UNA lámina fina por hora, a la altura media ponderada; color = cobertura media
    if(high.length){
      const g=ns('g'); g.setAttribute('filter',`url(#${fid})`); svg.appendChild(g);
      const HI_MIN=30;   // nivel alto por debajo de 30% se descarta
      for(let j=0;j<nH;j++){ let sp=0,sz=0,sf=0,cnt=0;
        for(const l of high){ const c=l.arr[G(j)]; if(c==null||c<HI_MIN) continue; cnt++; sp+=c; sf+=c/100; sz+=(c/100)*l.z; }
        if(!cnt) continue; const mc=sp/cnt, mz=sz/sf; const y=zY(mz);
        g.appendChild(el('rect',{x:X(j),y:(y-5).toFixed(1),width:SW,height:10,fill:grisCover(mc),opacity:alphaCover(mc)})); }
    }
    [2000,4000,6000,8000,10000].forEach(z=>{ if(z>zBase+300&&z<zTop-200){const y=zY(z);
      kmov.appendChild(el('text',{x:20,y:(y+2).toFixed(1),fill:'#60798f','font-size':7.2,'font-weight':700,'text-anchor':'middle',stroke:'#0c1a28','stroke-width':2.6,'paint-order':'stroke'},(z/1000)+' km')); }});
  }else if(VISI.nubes && D.ctot&&D.ctot.some(v=>v!=null)){
    const id=gradF('cl'+cid+'t', j=>D.ctot[G(j)]); if(id) svg.appendChild(el('rect',{x:gw0,y:plotT-7,width:(gw1-gw0),height:plotH+14,fill:`url(#${id})`,filter:`url(#${fid})`}));
  }

  // rejilla de temperatura + eje izquierdo fijo (°C y km/h)
  tks(tmin,tmax,4).forEach(v=> svg.appendChild(el('line',{x1:PADL,y1:tY(v),x2:gw1,y2:tY(v),stroke:'#2a3f54','stroke-width':1,opacity:.45})));
  axis.setAttribute('width',PADL); axis.setAttribute('height',Hsvg); axis.setAttribute('viewBox',`0 0 ${PADL} ${Hsvg}`);
  const aEl=(t,a,x)=>{const e=ns(t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;axis.appendChild(e);};
  aEl('text',{x:PADL-4,y:plotT-6,fill:'var(--temp)','font-size':9,'font-weight':800,'text-anchor':'end'},'Temp °C');
  tks(tmin,tmax,4).forEach(v=> aEl('text',{x:PADL-4,y:tY(v)+3,fill:'var(--temp)','font-size':10,'font-weight':700,'text-anchor':'end'},Math.round(v)+'°'));
  aEl('text',{x:PADL-4,y:plotB+31,fill:'var(--viento)','font-size':9,'font-weight':700,'text-anchor':'end'},'Viento');

  // rejilla vertical + horas + días
  let dAnt='';
  for(let j=0;j<nH;j++){ const g=G(j), d=D.time[g], hr=d.getHours(), dk=d.getDate()+'-'+d.getMonth();
    if(dk!==dAnt){ dAnt=dk; svg.appendChild(el('line',{x1:X(j),y1:42,x2:X(j),y2:plotB,stroke:'#49708f','stroke-width':1.2}));
    }else svg.appendChild(el('line',{x1:X(j),y1:plotT,x2:X(j),y2:plotB,stroke:'#22384c','stroke-width':1}));
    svg.appendChild(el('text',{x:XC(j),y:52,fill:'#9ab2c8','font-size':9,'text-anchor':'middle'},
      GEN?(String(hr).padStart(2,'0')+'-'+String(hr+6).padStart(2,'0')+'h'):(String(hr).padStart(2,'0')+'h')));
  }
  svg.appendChild(el('line',{x1:PADL,y1:plotB,x2:gw1,y2:plotB,stroke:'#49708f','stroke-width':1}));

  // lluvia (barra final) con mm encima
  if(VISI.lluvia) for(let j=0;j<nH;j++){ const cor=PC[j]||0; if(cor<=0)continue; const h=Math.max(1.5,(cor/rmax)*rPx);
    svg.appendChild(el('rect',{x:X(j)+6,y:plotB-h,width:SW-12,height:h,rx:2,fill:'var(--lluvia)',opacity:.6}));
    if(cor>=0.5) svg.appendChild(el('text',{x:XC(j),y:plotB-h-3,fill:'#bfe0ff','font-size':9,'font-weight':700,'text-anchor':'middle',stroke:'#0c1a28','stroke-width':2.4,'paint-order':'stroke'},cor.toFixed(1))); }

  // viento bajo el plot: UN cuadrito por hora con flecha + velocidad + procedencia (todo en teal)
  const R8=['N','NE','E','SE','S','SW','W','NW'];
  for(let j=0;j<nH;j++){ const v=D.wind[G(j)], dr=D.dir[G(j)]; if(v==null) continue; const cx=XC(j);
    svg.appendChild(el('rect',{x:cx-20,y:plotB+2,width:40,height:44,rx:4,fill:'none',stroke:'#2f4b63','stroke-width':1}));
    if(dr!=null) svg.appendChild(el('text',{x:cx,y:plotB+16,fill:'var(--viento)','font-size':14,'font-weight':700,'text-anchor':'middle',transform:`rotate(${dr+180} ${cx} ${plotB+13})`},'↑'));
    svg.appendChild(el('text',{x:cx,y:plotB+31,fill:'var(--viento)','font-size':8.5,'font-weight':800,'text-anchor':'middle'},Math.round(v)+' km/h'));
    if(dr!=null) svg.appendChild(el('text',{x:cx,y:plotB+42,fill:'var(--viento)','font-size':9,'font-weight':700,'text-anchor':'middle'},R8[Math.round(dr/45)%8]));
  }

  // líneas de viento (+racha) y temperatura
  const pw=f=>{let sp='';for(let j=0;j<nH;j++){const v=D[f][G(j)];if(v==null)continue;sp+=(sp?'L':'M')+XC(j)+' '+wY(v).toFixed(1)+' ';}return sp;};
  if(VISI.racha) svg.appendChild(el('path',{d:pw('gust'),fill:'none',stroke:'var(--racha)','stroke-width':1,'stroke-dasharray':'3 3',opacity:.6}));
  if(VISI.viento) svg.appendChild(el('path',{d:pw('wind'),fill:'none',stroke:'var(--viento)','stroke-width':2}));
  if(VISI.racha) for(let j=0;j<nH;j+=3){ const g=D.gust[G(j)]; if(g==null)continue;
    svg.appendChild(el('text',{x:XC(j),y:wY(g)-5,fill:'var(--racha)','font-size':9,'font-weight':700,'text-anchor':'middle'},Math.round(g)+' km/h')); }
  const both=VISI.temp&&VISI.sens, offT=both?-9:0, offS=both?9:0;
  const rangeMark=(cx,mx,mn,cL,cU,cD)=>{ if(mx==null||mn==null)return; const yT=tY(mx),yB=tY(mn);
    svg.appendChild(el('line',{x1:cx,y1:yT,x2:cx,y2:yB,stroke:cL,'stroke-width':2}));
    svg.appendChild(el('path',{d:`M${cx} ${yT} L${cx-5} ${yT+9} L${cx+5} ${yT+9} Z`,fill:cU}));
    svg.appendChild(el('path',{d:`M${cx} ${yB} L${cx-5} ${yB-9} L${cx+5} ${yB-9} Z`,fill:cD}));
    svg.appendChild(el('text',{x:cx,y:yT-7,fill:cU,'font-size':11,'font-weight':800,'text-anchor':'middle'},Math.round(mx)+'°'));
    svg.appendChild(el('text',{x:cx,y:yB+16,fill:cD,'font-size':11,'font-weight':800,'text-anchor':'middle'},Math.round(mn)+'°')); };
  if(VISI.sens){
    if(GEN){ for(let j=0;j<nH;j++) rangeMark(XC(j)+offS, D.smax&&D.smax[G(j)], D.smin&&D.smin[G(j)], 'var(--sens)','var(--sens)','var(--sens)'); }
    else { let ss='';for(let j=0;j<nH;j++){const v=D.sens[G(j)];if(v==null)continue;ss+=(ss?'L':'M')+XC(j)+' '+tY(v).toFixed(1)+' ';}
      svg.appendChild(el('path',{d:ss,fill:'none',stroke:'var(--sens)','stroke-width':2,'stroke-dasharray':'5 3',opacity:.9}));
      for(let j=0;j<nH;j+=3){const v=D.sens[G(j)];if(v==null)continue;svg.appendChild(el('text',{x:XC(j),y:tY(v)+14,fill:'var(--sens)','font-size':10,'font-weight':700,'text-anchor':'middle'},Math.round(v)+'°'));} }
  }
  if(VISI.temp){
    if(GEN){ for(let j=0;j<nH;j++) rangeMark(XC(j)+offT, D.tmax[G(j)], D.tmin[G(j)], 'var(--temp)','#ff6b6b','#8fd0ff'); }
    else { let sp='';for(let j=0;j<nH;j++){const v=D.temp[G(j)];if(v==null)continue;sp+=(sp?'L':'M')+XC(j)+' '+tY(v).toFixed(1)+' ';}
      svg.appendChild(el('path',{d:sp,fill:'none',stroke:'var(--temp)','stroke-width':2.4}));
      for(let j=0;j<nH;j+=3){const v=D.temp[G(j)];if(v==null)continue;svg.appendChild(el('text',{x:XC(j),y:tY(v)-7,fill:'#ffb784','font-size':10,'font-weight':700,'text-anchor':'middle'},Math.round(v)+'°'));} }
  }

  // transición AROME -> ECMWF (si cae en la ventana)
  let it=-1; for(let j=0;j<nH;j++){ if(D.src[G(j)]==='E'){it=j;break;} }
  if(it>0){ svg.appendChild(el('line',{x1:X(it),y1:42,x2:X(it),y2:plotB,stroke:'#9b8cff','stroke-width':1.5,'stroke-dasharray':'4 3',opacity:.85}));
    svg.appendChild(el('text',{x:X(it)-4,y:60,fill:'#9ab2c8','font-size':10,'font-weight':700,'text-anchor':'end'},'AROME'));
    svg.appendChild(el('text',{x:X(it)+4,y:60,fill:'#b3a8ff','font-size':10,'font-weight':700},'ECMWF')); }

  // "ahora"
  const now=new Date();
  for(let j=0;j<nH-1;j++){ if(D.time[G(j)]<=now&&now<D.time[G(j)+1]){ const xn=XC(j)+(now-D.time[G(j)])/stepMs*SW;
    svg.appendChild(el('line',{x1:xn,y1:plotT-6,x2:xn,y2:plotB,stroke:'#ffd166','stroke-width':1,'stroke-dasharray':'2 5',opacity:.45}));
    svg.appendChild(el('text',{x:xn+3,y:plotT+2,fill:'#ffd166','font-size':9,'font-weight':700},'ahora')); break; } }

  // cabecera de día pegajosa NATIVA: una sección por día; la etiqueta sticky se queda fija y la empuja la del día siguiente
  dayrow.style.width=W+'px'; content.style.width=W+'px';
  { const sp0=document.createElement('div'); sp0.style.cssText='flex:0 0 auto;width:'+PADL+'px'; dayrow.appendChild(sp0);
    let jj=0;
    while(jj<nH){ const d=D.time[G(jj)], dk=d.getDate()+'-'+d.getMonth();
      let cnt=0,tot=0,tmn=Infinity,tmx=-Infinity,sC=0,sH=0,sLM=0,nc=0;
      while(jj+cnt<nH && (D.time[G(jj+cnt)].getDate()+'-'+D.time[G(jj+cnt)].getMonth())===dk){
        const gi=G(jj+cnt); tot+=PC[jj+cnt]||0;
        const lo=(D.tmin&&D.tmin[gi]!=null)?D.tmin[gi]:D.temp[gi], hi=(D.tmax&&D.tmax[gi]!=null)?D.tmax[gi]:D.temp[gi];
        if(lo!=null&&lo<tmn)tmn=lo; if(hi!=null&&hi>tmx)tmx=hi;
        if(D.ctot[gi]!=null){sC+=D.ctot[gi];nc++;} if(D.ch[gi]!=null)sH+=D.ch[gi]; sLM+=Math.max(D.cl[gi]||0,D.cm[gi]||0);
        cnt++; }
      const C=nc?sC/nc:0, H=nc?sH/nc:0, LM=nc?sLM/nc:0, ico=iconoDia(tot,C,H,LM,tmx);
      const sec=document.createElement('div'); sec.className='daysec'; sec.style.width=(cnt*SW)+'px';
      const lbl=document.createElement('div'); lbl.className='daylbl';
      lbl.innerHTML=`${ico} ${DIAS[d.getDay()]} ${d.getDate()} ${capMes(d.getMonth())} `+
        `<span style="color:#7fc0ff;font-size:12px;font-weight:700">(💧 ${tot.toFixed(1)}mm)</span>`+
        (isFinite(tmn)?`<span style="color:#8fd0ff;font-size:14px;margin-left:13px">mín ${Math.round(tmn)}°</span>`+
                       `<span style="color:#ff6b6b;font-size:14px;margin-left:7px">máx ${Math.round(tmx)}°</span>`:'');
      sec.appendChild(lbl); dayrow.appendChild(sec); jj+=cnt; } }
  requestAnimationFrame(()=>{
    if(fromStart){ wrap.scrollLeft=0; }
    else { let j8=0; for(let j=0;j<nH;j++){ if(D.time[G(j)].getHours()>=8){j8=j;break;} } wrap.scrollLeft=Math.max(0, X(j8)-6); }
  });

  // tooltip (toca una hora)
  svg.addEventListener('click', e=>{ const r=svg.getBoundingClientRect(); const j=Math.floor((e.clientX-r.left-PADL)/SW);
    if(j<0||j>=nH){ tip.style.display='none'; return; } mostrar(G(j)); });
}

/* ===== tooltip ===== */
function iconoDia(P,C,H,LM,tmax){   // P=lluvia mm/día, C=nubes total %, H=nubes altas %, LM=bajas/medias %
  const frio = tmax!=null && tmax<2;
  if(P>=1){ if(frio) return '🌨️'; if(P>=8) return '⛈️'; if(LM>=60) return '🌧️'; return '🌦️'; }
  if(LM>=60 || C>=75) return '☁️';
  if(LM>=25) return '⛅';
  if(H>=30) return '🌤️';
  return '☀️';
}
function nubesTexto(ch,cm,cl,ctot){
  const TH=40;
  if(ch!=null||cm!=null||cl!=null){
    const a=(ch||0)>=TH, m=(cm||0)>=TH, b=(cl||0)>=TH;
    if(a&&m&&b) return 'muy nuboso';
    const p=[]; if(a)p.push('altas'); if(m)p.push('medias'); if(b)p.push('bajas');
    if(!p.length) return 'despejado';
    return 'nubes '+(p.length>1 ? p.slice(0,-1).join(', ')+' y '+p[p.length-1] : p[0]);
  }
  const c=ctot||0;
  return c<20?'despejado':c<50?'poco nuboso':c<80?'nuboso':'muy nuboso';
}
function mostrar(i){
  if(!DATA) return;
  const DA=DS();
  const d=DA.time[i], dr=DA.dir[i];
  const rumbo= dr==null?'–':RUMBOS[Math.round(dr/22.5)%16];
  const prC=precipCorr(DA.praw[i]||0, dr, DA.src?DA.src[i]:'E');
  const nub=nubesTexto(DA.ch?.[i], DA.cm?.[i], DA.cl?.[i], DA.ctot?.[i]);
  tip.innerHTML=`<span class="tipx">✕</span><h4>${DIAS[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}:00</h4>`+
    `<div class="r"><span class="k">Temp</span><b>${DA.temp[i]!=null?Math.round(DA.temp[i])+'°':'–'}</b></div>`+
    `<div class="r"><span class="k">Lluvia</span><b>${prC>0?prC.toFixed(1)+' mm':'0'}</b></div>`+
    `<div class="r"><span class="k">Viento</span><b>${DA.wind[i]!=null?Math.round(DA.wind[i]):'–'} ${rumbo}${DA.gust[i]>DA.wind[i]+10?' ('+Math.round(DA.gust[i])+')':''}</b></div>`+
    `<div class="r"><span class="k">Nubes</span><b>${nub}</b></div>`+
    `<div class="r"><span class="k">Modelo</span><b>${DA.src&&DA.src[i]==='A'?'AROME':'ECMWF'} + WM1.0</b></div>`;
  tip.style.display='block';
}
document.addEventListener('click', e=>{ if(!e.target.closest('.mg-wrap') && !e.target.closest('#tip')) tip.style.display='none'; });
tip.addEventListener('click', e=>{ if(e.target.closest('.tipx')) tip.style.display='none'; });

sel.addEventListener('change', cargar);
document.querySelectorAll('.loctipo .lt').forEach(b=>{ b.addEventListener('click',()=>{ if(b.classList.contains('activa'))return;
  document.querySelectorAll('.loctipo .lt').forEach(x=>x.classList.remove('activa')); b.classList.add('activa'); poblarSelector(b.dataset.tipo); cargar(); }); });
{ const mGen=document.getElementById('mGen'), mDet=document.getElementById('mDet');
  const setMode=m=>{ MODE=m; VISI=(m==='gen')?VIS_GEN:VIS_DET; mGen.classList.toggle('on',m==='gen'); mDet.classList.toggle('on',m==='det'); syncLeg(); if(DATA) pintarTodo(); };
  mGen.addEventListener('click',()=>setMode('gen')); mDet.addEventListener('click',()=>setMode('det')); }
const legBtns=[...document.querySelectorAll('.leg b[data-k]')];
function syncLeg(){ legBtns.forEach(b=>b.classList.toggle('off', !VISI[b.dataset.k])); }
legBtns.forEach(b=>{ const k=b.dataset.k; b.addEventListener('click',()=>{ VISI[k]=!VISI[k]; b.classList.toggle('off',!VISI[k]); if(DATA) pintarTodo(); }); });
syncLeg();
document.getElementById('foot').innerHTML =
  'Previsión especializada en montaña, elaborada a partir del estudio microclimático del Sistema Central y el oeste peninsular. '+
  'No constituye una fuente meteorológica oficial; para la predicción y los avisos oficiales, consulte AEMET.';
cargar();
</script>
