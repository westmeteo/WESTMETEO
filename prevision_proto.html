<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Previsión (prototipo meteograma) · @westmeteo</title>
<style>
  :root{ --bg:#0f1f30; --panel:#16293d; --line:#33506b; --ink:#eaf2f8; --ink2:#cfe0ee; --mut:#7f9bb3;
         --azul:#8fd0ff; --temp:#ff9d5c; --viento:#5fe0c0; --lluvia:#4aa3ff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;-webkit-text-size-adjust:100%}
  header{padding:12px 14px 6px}
  h1{font-size:17px;margin:0 0 2px} .sub{color:var(--azul);font-size:12px}
  .beta{background:#b4532a;color:#fff;font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:6px}
  .fuente{color:var(--mut);font-size:11px;margin:4px 0 0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 14px 8px}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
  .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);padding:0 14px 8px}
  .leg b{display:inline-flex;align-items:center;gap:5px;font-weight:600}
  .sw{width:16px;height:4px;border-radius:2px;display:inline-block}
  .sw.sq{height:11px;width:11px;border-radius:2px}
  #charts .mg-box{margin-top:16px}
  .cap{color:#9fb6c8;font-size:12px;font-weight:800;padding:2px 14px 4px}
  .mg-posic{position:relative}
  .mg-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
           border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(#0c1a28,#0f1f30)}
  .mg-wrap svg{display:block}
  .axis{position:absolute;left:0;top:1px;pointer-events:none;background:linear-gradient(#0c1a28,#0f1f30);border-right:1px solid rgba(58,86,112,.35)}
  .kmaxis{position:absolute;left:50%;top:1px;transform:translateX(-50%);pointer-events:none}
  .hint{color:var(--mut);font-size:11px;padding:8px 14px;text-align:center}
  #tip{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,20,32,.97);
       border:1px solid var(--azul);border-radius:12px;padding:12px 15px;font-size:13px;color:var(--ink);
       pointer-events:none;display:none;min-width:200px;box-shadow:0 12px 34px rgba(0,0,0,.6)}
  #tip h4{margin:0 0 7px;font-size:12px;color:var(--azul)}
  #tip .r{display:flex;justify-content:space-between;gap:12px}
  #tip .k{color:var(--mut)}
  footer{color:var(--mut);font-size:11px;padding:10px 14px 24px}
  .warn{color:#e0994a}
</style>
</head>
<body data-palette="#ff9d5c,#5fe0c0,#4aa3ff,#8fd0ff">
<header>
  <h1>Previsión <span class="beta">PROTOTIPO</span></h1>
  <div class="sub">Meteograma apilado · <b>AROME</b> mientras cubre + <b>ECMWF</b> × <b>WM1.0</b></div>
  <p class="fuente" id="fuente">Cargando…</p>
</header>
<div class="row">
  <label for="sel" style="color:var(--ink2);font-size:12px">Lugar</label>
  <select id="sel"></select>
</div>
<div class="leg">
  <b><span class="sw" style="background:var(--temp)"></span>Temperatura (°C)</b>
  <b><span class="sw" style="background:var(--viento)"></span>Viento (km/h)</b>
  <b><span class="sw sq" style="background:var(--lluvia);opacity:.6"></span>Lluvia (mm/h)</b>
  <b><span class="sw sq" style="background:linear-gradient(90deg,#d8dee4,#4a535c)"></span>Nubes por altitud (claro→oscuro = %)</b>
</div>
<div id="charts"></div>
<div class="hint">Cada bloque = 7 días; el siguiente empieza un día después · desliza con el dedo ← → · toca una hora</div>
<div id="tip"></div>
<footer id="foot"></footer>

<script>
/* ===== config ===== */
const LUGARES = [
  {id:'bejar',  n:'Béjar',               lat:40.3852, lon:-5.7645},
  {id:'candelario', n:'Candelario',      lat:40.3700, lon:-5.7450},
  {id:'hoyos',  n:'Hoyos del Espino',    lat:40.3470, lon:-5.1750},
  {id:'navarredonda', n:'Navarredonda',  lat:40.3400, lon:-5.1300},
];
// WM1.0: la lluvia SOLO se realza con flujo del S/SO/O (upslope en la sierra). PROVISIONAL.
const WM02 = { precipArome: 3.0, precipEcmwf: 3.8, tempOffset: 0.0, windFactor: 1.0 };
const   WM02_ON=true;   // sesgo WM1.0 SIEMPRE activo (realce de lluvia solo con flujo S/SO/O)
const PLEV=[[1000,110],[925,760],[850,1460],[700,3010],[500,5570],[400,7180],[300,9160],[250,10360],[200,11780]]; // hPa -> altitud m
const enSO = dir => dir!=null && dir>=175 && dir<=280;
function precipCorr(raw, dir, src){ if(!raw) return 0; return (WM02_ON && enSO(dir)) ? raw*(src==='A'?WM02.precipArome:WM02.precipEcmwf) : raw; }

const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const capMes=m=>{const s=MES[m];return s.charAt(0).toUpperCase()+s.slice(1);};
const RUMBOS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
const MAX_CHARTS=6;

/* ===== geometría ===== */
const HOURW=46, PADL=56, PADR=20, TOP=64, BOT=46, Hsvg=360;
const plotT=TOP, plotB=Hsvg-BOT, plotH=plotB-plotT;

const sel=document.getElementById('sel'), tip=document.getElementById('tip');
LUGARES.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.n;sel.appendChild(o);});
let DATA=null;

function ns(t){return document.createElementNS('http://www.w3.org/2000/svg',t);}
function el(t,a,txt){const e=ns(t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}
function tks(min,max,n){ const span=(max-min)||1; let step=Math.pow(10,Math.floor(Math.log10(span/n))); const e=(span/n)/step; step*= e>=5?5:e>=2?2:1; const out=[]; for(let v=Math.ceil(min/step)*step; v<=max+1e-6; v+=step) out.push(v); return out; }

/* ===== datos ===== */
async function cargar(){
  const l=LUGARES.find(x=>x.id===sel.value)||LUGARES[0];
  document.getElementById('fuente').textContent='Cargando AROME + ECMWF…';
  const vars='temperature_2m,precipitation,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,'+
             'wind_speed_10m,wind_gusts_10m,wind_direction_10m';
  const extraCloud=PLEV.map(([p])=>`cloud_cover_${p}hPa`).join(',');
  const u=(m,days,extra)=>`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}`+
    `&hourly=${vars}${extra?','+extra:''}&models=${m}&timezone=Europe%2FMadrid&windspeed_unit=kmh&forecast_days=${days}`;
  let A,E;
  try{
    [A,E]=await Promise.all([
      fetch(u('meteofrance_arome_france_hd',3)).then(r=>r.json()).catch(()=>null),   // AROME: mientras cubra
      fetch(u('ecmwf_ifs025',15,extraCloud)).then(r=>r.json()),                      // ECMWF: 15 días (temporal) + perfil de nubes
    ]);
  }catch(e){ document.getElementById('fuente').innerHTML='<span class="warn">No se pudo cargar la previsión.</span>'; return; }
  const EH=E.hourly, AH=(A&&A.hourly)||{time:[]};
  const aIdx={}; (AH.time||[]).forEach((t,k)=>aIdx[t]=k);
  const N=EH.time.length, src=new Array(N);
  for(let i=0;i<N;i++){ const ak=aIdx[EH.time[i]]; const aT=(ak!=null&&AH.temperature_2m)?AH.temperature_2m[ak]:null; src[i]=(aT!=null)?'A':'E'; }
  const mix=f=> EH.time.map((t,i)=>{ const ak=aIdx[t]; return (src[i]==='A'&&AH[f])?AH[f][ak]:EH[f][i]; });
  const prRaw=mix('precipitation');
  DATA={
    time:EH.time.map(t=>new Date(t)),
    temp:mix('temperature_2m').map(v=> v==null?null:v+WM02.tempOffset),
    praw:prRaw.map(v=> v==null?0:v),
    cl:mix('cloud_cover_low'), cm:mix('cloud_cover_mid'), ch:mix('cloud_cover_high'), ctot:mix('cloud_cover'),
    wind:mix('wind_speed_10m').map(v=> v==null?null:v*WM02.windFactor),
    gust:mix('wind_gusts_10m').map(v=> v==null?null:v*WM02.windFactor),
    dir:mix('wind_direction_10m'), src,
  };
  DATA.l=l; DATA.nA=src.filter(s=>s==='A').length;
  DATA.clev=PLEV.map(([p,z])=>({z,arr:EH['cloud_cover_'+p+'hPa']})).filter(o=>o.arr&&o.arr.some(v=>v!=null&&v>3));
  pintarTodo();
}

function setFuente(){
  if(!DATA) return;
  document.getElementById('fuente').innerHTML=`<b>${DATA.l.n}</b> · AROME las primeras ${DATA.nA} h, luego ECMWF · <span style="color:#bfe0ff">WM1.0 lluvia (flujo S/SO/O)</span>`;
}

function pintarTodo(){
  const host=document.getElementById('charts'); host.innerHTML='';
  if(!DATA){ return; }
  const end7=Math.min(DATA.time.length, 7*24);
  const end15=Math.min(DATA.time.length, 15*24);
  drawChart(0, 0, end15);                                   // TEMPORAL: primera gráfica a 15 días (para inspeccionar condiciones)
  for(let k=1; k*24 < end7; k++) drawChart(k, k*24, end7);  // resto: escalera hasta el día 7
  setFuente();
}

/* ===== una gráfica (ventana de 7 días desde el índice s) ===== */
function drawChart(cid, s, endIdx){
  const D=DATA, N=D.time.length, nH=endIdx - s;
  if(nH<6) return;
  const box=document.createElement('div'); box.className='mg-box';
  const cap=document.createElement('div'); cap.className='cap';
  const d0=D.time[s];
  cap.textContent=`${DIAS[d0.getDay()]} ${d0.getDate()} ${capMes(d0.getMonth())}`;
  const posic=document.createElement('div'); posic.className='mg-posic';
  const wrap=document.createElement('div'); wrap.className='mg-wrap';
  const svg=ns('svg'); wrap.appendChild(svg);
  const axis=ns('svg'); axis.setAttribute('class','axis');
  const kmov=ns('svg'); kmov.setAttribute('class','kmaxis'); kmov.setAttribute('width',40); kmov.setAttribute('height',Hsvg); kmov.setAttribute('viewBox',`0 0 40 ${Hsvg}`);
  posic.appendChild(wrap); posic.appendChild(axis); posic.appendChild(kmov);
  box.appendChild(cap); box.appendChild(posic);
  document.getElementById('charts').appendChild(box);

  const W=PADL+PADR+nH*HOURW, gw0=PADL, gw1=W-PADR;
  svg.setAttribute('width',W); svg.setAttribute('height',Hsvg); svg.setAttribute('viewBox',`0 0 ${W} ${Hsvg}`);
  const X=j=>PADL+j*HOURW, XC=j=>X(j)+HOURW/2, G=j=>s+j;

  const defs=ns('defs'); svg.appendChild(defs);
  const fid='f'+cid;
  defs.insertAdjacentHTML('beforeend',
    `<filter id="${fid}" x="-8%" y="-45%" width="116%" height="190%">`+
    '<feTurbulence type="fractalNoise" baseFrequency="0.011 0.045" numOctaves="4" seed="11" result="n"/>'+
    `<feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" result="d"/>`+
    '<feGaussianBlur in="d" stdDeviation="2.4"/></filter>');

  // escalas sobre la ventana
  const T=[]; for(let j=0;j<nH;j++){const v=D.temp[G(j)]; if(v!=null)T.push(v);}
  let tmin=0,tmax=10; if(T.length){ tmin=Math.floor(Math.min(...T)-1); tmax=Math.ceil(Math.max(...T)+1); }
  const tY=t=>plotB-(t-tmin)/((tmax-tmin)||1)*(plotH-16)-8;
  let wmax=25; for(let j=0;j<nH;j++) wmax=Math.max(wmax, D.wind[G(j)]||0, D.gust[G(j)]||0);
  const wY=w=>plotB-(w/wmax)*(plotH*0.55)-6;
  const PC=[]; for(let j=0;j<nH;j++){ const g=G(j); PC[j]=precipCorr(D.praw[g]||0, D.dir[g], D.src[g]); }
  let rmax=3; for(let j=0;j<nH;j++) rmax=Math.max(rmax,PC[j]); const rPx=plotH*0.42;

  const grisCover=c=>{const f=Math.max(0,Math.min(1,c/100));const L=Math.round(216-f*154);return `rgb(${L},${L+5},${L+11})`;};
  const alphaCover=c=>{const f=Math.max(0,Math.min(1,c/100));return (Math.pow(f,0.8)*0.92).toFixed(3);};
  const gradF=(id,valAt)=>{let st='',has=false;
    for(let j=0;j<nH;j++){const c=valAt(j); if(c==null||c<=0)continue; has=true;
      st+=`<stop offset="${((j+0.5)/nH).toFixed(4)}" stop-color="${grisCover(c)}" stop-opacity="${alphaCover(c)}"/>`;}
    if(!has)return null;
    defs.insertAdjacentHTML('beforeend',`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${gw0}" y1="0" x2="${gw1}" y2="0">${st}</linearGradient>`);
    return id;};

  // NUBES por altitud (perfil de presión ECMWF)
  if(D.clev&&D.clev.length){
    const lev=D.clev.slice().sort((a,b)=>a.z-b.z);
    const zBase=0, zTop=Math.max(2600, lev[lev.length-1].z+800);
    const zY=z=>plotB-(z-zBase)/(zTop-zBase)*plotH;
    const thick=z=>Math.max(9, 26-(z/12000)*17);   // decks bajos gruesos, nubes medias algo más finas
    const low=lev.filter(l=>l.z<6000), high=lev.filter(l=>l.z>=6000);
    // bajo/medio (<6000 m): puentes entre niveles contiguos con nube (masa continua) + lámina por nivel
    for(let k=0;k<low.length-1;k++){ const lo=low[k], hi=low[k+1];
      const id=gradF(`br${cid}_${k}`, j=>{ const a=lo.arr[G(j)], b=hi.arr[G(j)]; return (a!=null&&b!=null&&a>0&&b>0)?Math.min(a,b):null; });
      if(id){ const y1=zY(hi.z), y2=zY(lo.z); svg.appendChild(el('rect',{x:gw0,y:y1.toFixed(1),width:(gw1-gw0),height:(y2-y1).toFixed(1),fill:`url(#${id})`,filter:`url(#${fid})`})); } }
    low.forEach((l,k)=>{ const id=gradF(`cl${cid}_${k}`, j=>l.arr[G(j)]); if(!id)return; const y=zY(l.z), h=thick(l.z);
      svg.appendChild(el('rect',{x:gw0,y:(y-h/2).toFixed(1),width:(gw1-gw0),height:h.toFixed(1),fill:`url(#${id})`,filter:`url(#${fid})`})); });
    // alto (>=6000 m): UNA lámina fina por hora, a la altura media ponderada; color = cobertura media
    if(high.length){
      const g=ns('g'); g.setAttribute('filter',`url(#${fid})`); svg.appendChild(g);
      const HI_MIN=30;   // descartar niveles altos por debajo de 30% (no cuentan ni para color ni para altura)
      for(let j=0;j<nH;j++){ let sp=0,sz=0,sf=0,cnt=0;
        for(const l of high){ const c=l.arr[G(j)]; if(c==null||c<HI_MIN) continue; cnt++; sp+=c; sf+=c/100; sz+=(c/100)*l.z; }
        if(!cnt) continue; const mc=sp/cnt, mz=sz/sf; const y=zY(mz);   // color=media %, altura=media ponderada por cobertura
        g.appendChild(el('rect',{x:X(j),y:(y-5).toFixed(1),width:HOURW,height:10,fill:grisCover(mc),opacity:alphaCover(mc)})); }
    }
    [2000,4000,6000,8000,10000].forEach(z=>{ if(z>zBase+300&&z<zTop-200){const y=zY(z);
      kmov.appendChild(el('text',{x:20,y:(y+2).toFixed(1),fill:'#60798f','font-size':7.2,'font-weight':700,'text-anchor':'middle',stroke:'#0c1a28','stroke-width':2.6,'paint-order':'stroke'},(z/1000)+' km')); }});
  }else if(D.ctot&&D.ctot.some(v=>v!=null)){
    const id=gradF('cl'+cid+'t', j=>D.ctot[G(j)]); if(id) svg.appendChild(el('rect',{x:gw0,y:plotT-7,width:(gw1-gw0),height:plotH+14,fill:`url(#${id})`,filter:`url(#${fid})`}));
  }

  // rejilla de temperatura + eje izquierdo fijo (°C y km/h)
  tks(tmin,tmax,4).forEach(v=> svg.appendChild(el('line',{x1:PADL,y1:tY(v),x2:gw1,y2:tY(v),stroke:'#2a3f54','stroke-width':1,opacity:.45})));
  axis.setAttribute('width',PADL); axis.setAttribute('height',Hsvg); axis.setAttribute('viewBox',`0 0 ${PADL} ${Hsvg}`);
  const aEl=(t,a,x)=>{const e=ns(t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;axis.appendChild(e);};
  aEl('text',{x:18,y:plotT-6,fill:'var(--temp)','font-size':9,'font-weight':800,'text-anchor':'middle'},'°C');
  aEl('text',{x:44,y:plotT-6,fill:'var(--viento)','font-size':9,'font-weight':800,'text-anchor':'middle'},'km/h');
  tks(tmin,tmax,4).forEach(v=> aEl('text',{x:28,y:tY(v)+3,fill:'var(--temp)','font-size':10,'font-weight':700,'text-anchor':'end'},Math.round(v)+'°'));
  tks(0,wmax,4).forEach(v=>{ if(v<=0)return; aEl('text',{x:PADL-3,y:wY(v)+3,fill:'var(--viento)','font-size':10,'font-weight':700,'text-anchor':'end'},Math.round(v)); });

  // rejilla vertical + horas + días
  let dAnt='';
  for(let j=0;j<nH;j++){ const g=G(j), d=D.time[g], hr=d.getHours(), dk=d.getDate()+'-'+d.getMonth();
    if(dk!==dAnt){ dAnt=dk;
      svg.appendChild(el('line',{x1:X(j),y1:42,x2:X(j),y2:plotB,stroke:'#49708f','stroke-width':1.2}));
      let tot=0,tmn=Infinity,tmx=-Infinity;
      for(let k=j;k<nH&&(D.time[G(k)].getDate()+'-'+D.time[G(k)].getMonth())===dk;k++){ tot+=PC[k]||0; const tv=D.temp[G(k)]; if(tv!=null){ if(tv<tmn)tmn=tv; if(tv>tmx)tmx=tv; } }
      const th=el('text',{x:X(j)+6,y:24,fill:'#eaf2f8','font-size':15,'font-weight':800});
      th.appendChild(el('tspan',{},`${DIAS[d.getDay()]} ${d.getDate()} ${capMes(d.getMonth())} `));
      th.appendChild(el('tspan',{fill:'#7fc0ff','font-size':11,'font-weight':700},`(${tot.toFixed(1)}mm) `));
      if(isFinite(tmn)){ th.appendChild(el('tspan',{fill:'#8fd0ff','font-size':13,'font-weight':800},` ${Math.round(tmn)}°`));
        th.appendChild(el('tspan',{fill:'#ff6b6b','font-size':13,'font-weight':800},` ${Math.round(tmx)}°`)); }
      svg.appendChild(th);
    }else svg.appendChild(el('line',{x1:X(j),y1:plotT,x2:X(j),y2:plotB,stroke:'#22384c','stroke-width':1}));
    svg.appendChild(el('text',{x:XC(j),y:Hsvg-28,fill:'#9ab2c8','font-size':10,'text-anchor':'middle'},String(hr).padStart(2,'0')));
  }
  svg.appendChild(el('line',{x1:PADL,y1:plotB,x2:gw1,y2:plotB,stroke:'#49708f','stroke-width':1}));

  // lluvia (barra final) con mm encima
  for(let j=0;j<nH;j++){ const cor=PC[j]||0; if(cor<=0)continue; const h=Math.max(1.5,(cor/rmax)*rPx);
    svg.appendChild(el('rect',{x:X(j)+6,y:plotB-h,width:HOURW-12,height:h,rx:2,fill:'var(--lluvia)',opacity:.6}));
    if(cor>=0.5) svg.appendChild(el('text',{x:XC(j),y:plotB-h-3,fill:'#bfe0ff','font-size':9,'font-weight':700,'text-anchor':'middle',stroke:'#0c1a28','stroke-width':2.4,'paint-order':'stroke'},cor.toFixed(1))); }

  // flechas de viento (grandes)
  for(let j=0;j<nH;j+=2){ const dr=D.dir[G(j)]; if(dr==null)continue;
    svg.appendChild(el('text',{x:XC(j),y:53,fill:'#5fe0c0','font-size':17,'font-weight':700,'text-anchor':'middle',transform:`rotate(${dr+180} ${XC(j)} 48)`},'↑')); }

  // líneas de viento (+racha) y temperatura
  const pw=f=>{let sp='';for(let j=0;j<nH;j++){const v=D[f][G(j)];if(v==null)continue;sp+=(sp?'L':'M')+XC(j)+' '+wY(v).toFixed(1)+' ';}return sp;};
  svg.appendChild(el('path',{d:pw('gust'),fill:'none',stroke:'var(--viento)','stroke-width':1,'stroke-dasharray':'3 3',opacity:.5}));
  svg.appendChild(el('path',{d:pw('wind'),fill:'none',stroke:'var(--viento)','stroke-width':2}));
  let sp='';for(let j=0;j<nH;j++){const v=D.temp[G(j)];if(v==null)continue;sp+=(sp?'L':'M')+XC(j)+' '+tY(v).toFixed(1)+' ';}
  svg.appendChild(el('path',{d:sp,fill:'none',stroke:'var(--temp)','stroke-width':2.4}));
  for(let j=0;j<nH;j+=3){const v=D.temp[G(j)];if(v==null)continue;svg.appendChild(el('text',{x:XC(j),y:tY(v)-7,fill:'#ffb784','font-size':10,'font-weight':700,'text-anchor':'middle'},Math.round(v)+'°'));}

  // transición AROME -> ECMWF (si cae en la ventana)
  let it=-1; for(let j=0;j<nH;j++){ if(D.src[G(j)]==='E'){it=j;break;} }
  if(it>0){ svg.appendChild(el('line',{x1:X(it),y1:42,x2:X(it),y2:plotB,stroke:'#9b8cff','stroke-width':1.5,'stroke-dasharray':'4 3',opacity:.85}));
    svg.appendChild(el('text',{x:X(it)-4,y:60,fill:'#9ab2c8','font-size':10,'font-weight':700,'text-anchor':'end'},'AROME'));
    svg.appendChild(el('text',{x:X(it)+4,y:60,fill:'#b3a8ff','font-size':10,'font-weight':700},'ECMWF')); }

  // "ahora"
  const now=new Date();
  for(let j=0;j<nH-1;j++){ if(D.time[G(j)]<=now&&now<D.time[G(j)+1]){ const xn=XC(j)+(now-D.time[G(j)])/3600000*HOURW;
    svg.appendChild(el('line',{x1:xn,y1:plotT-6,x2:xn,y2:plotB,stroke:'#ffd166','stroke-width':1.5,opacity:.9}));
    svg.appendChild(el('text',{x:xn+3,y:plotT+2,fill:'#ffd166','font-size':9,'font-weight':700},'ahora')); break; } }

  // scroll inicial a las 06:00 de la ventana
  let j6=0; for(let j=0;j<nH;j++){ if(D.time[G(j)].getHours()>=6){j6=j;break;} }
  requestAnimationFrame(()=>{ wrap.scrollLeft=Math.max(0, X(j6)-6); });

  // tooltip (toca una hora)
  svg.addEventListener('click', e=>{ const r=svg.getBoundingClientRect(); const j=Math.floor((e.clientX-r.left-PADL)/HOURW);
    if(j<0||j>=nH){ tip.style.display='none'; return; } mostrar(G(j)); });
}

/* ===== tooltip ===== */
function nubesTexto(ch,cm,cl,ctot){
  const TH=40;
  if(ch!=null||cm!=null||cl!=null){
    const a=(ch||0)>=TH, m=(cm||0)>=TH, b=(cl||0)>=TH;
    if(a&&m&&b) return 'muy nuboso';
    const p=[]; if(a)p.push('altas'); if(m)p.push('medias'); if(b)p.push('bajas');
    if(!p.length) return 'despejado';
    return 'nubes '+(p.length>1 ? p.slice(0,-1).join(', ')+' y '+p[p.length-1] : p[0]);
  }
  const c=ctot||0;
  return c<20?'despejado':c<50?'poco nuboso':c<80?'nuboso':'muy nuboso';
}
function mostrar(i){
  if(!DATA) return;
  const d=DATA.time[i], dr=DATA.dir[i];
  const rumbo= dr==null?'–':RUMBOS[Math.round(dr/22.5)%16];
  const prC=precipCorr(DATA.praw[i]||0, dr, DATA.src?DATA.src[i]:'E');
  const nub=nubesTexto(DATA.ch?.[i], DATA.cm?.[i], DATA.cl?.[i], DATA.ctot?.[i]);
  tip.innerHTML=`<h4>${DIAS[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}:00</h4>`+
    `<div class="r"><span class="k">Temp</span><b>${DATA.temp[i]!=null?Math.round(DATA.temp[i])+'°':'–'}</b></div>`+
    `<div class="r"><span class="k">Lluvia</span><b>${prC>0?prC.toFixed(1)+' mm':'0'}</b></div>`+
    `<div class="r"><span class="k">Viento</span><b>${DATA.wind[i]!=null?Math.round(DATA.wind[i]):'–'} ${rumbo}${DATA.gust[i]>DATA.wind[i]+10?' ('+Math.round(DATA.gust[i])+')':''}</b></div>`+
    `<div class="r"><span class="k">Nubes</span><b>${nub}</b></div>`+
    `<div class="r"><span class="k">Modelo</span><b>${DATA.src&&DATA.src[i]==='A'?'AROME':'ECMWF'} + WM1.0</b></div>`;
  tip.style.display='block';
}
document.addEventListener('click', e=>{ if(!e.target.closest('.mg-wrap')) tip.style.display='none'; });

sel.addEventListener('change', cargar);
document.getElementById('foot').innerHTML =
  'Prototipo de nueva Previsión (meteograma apilado). Solo los 7 primeros días: el primer bloque es la semana completa y cada bloque de abajo empieza un día después (el último, solo 24 h). '+
  '<b>AROME</b> mientras cubre (primeras ~48 h), luego <b>ECMWF</b>. Lluvia con corrección <b>WM1.0</b> (realce solo con flujo del <b>S/SO/O</b>). '+
  'Nubes por altitud desde el perfil de presión de ECMWF. No es fuente oficial; contrasta con AEMET.';
cargar();
</script>
